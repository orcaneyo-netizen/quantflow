[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantflow"
version = "0.1.0"
description = "Event-driven backtesting engine with broker simulation, explicit costs, and auditable event log"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "QuantFlow Contributors"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=4.1"]

[project.scripts]
quantflow = "quantflow.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["quantflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-q --tb=short"
filterwarnings = [
    "ignore::RuntimeWarning",
    "ignore::FutureWarning",
]